<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards - Worlds Under Siege</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .topbar {
      background: #000;
      padding: 14px 24px;
      border-bottom: 2px solid #222;
    }

    .topbar-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .top-logo {
      height: 58px;
      width: auto;
      display: block;
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,.09);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .nav a:hover { background: #22c55e; }

    .page-header,
    .controls,
    .results-count,
    .card-grid,
    .empty-state {
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }

    .page-header { padding: 28px 24px 10px; }
    .page-header h1 { margin: 0 0 10px; font-size: 36px; }
    .page-header p { margin: 0; color: #cbd5e1; }

    .controls {
      padding: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls input,
    .controls select {
      padding: 12px 14px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
    }

    .controls input {
      min-width: 260px;
      flex: 1 1 320px;
    }

    .controls select {
      min-width: 190px;
      background: white;
    }

    .results-count {
      padding: 0 24px 18px;
      color: #cbd5e1;
    }

    .card-grid {
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 32px rgba(0,0,0,.35);
    }

    .card-image-wrap {
      background: #0f172a;
      aspect-ratio: 63 / 88;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .2s ease;
    }

    .card:hover .card-image-wrap img { transform: scale(1.04); }

    .stronghold-card .card-image-wrap {
      aspect-ratio: 88 / 63;
      background: #0b1020;
    }

    .stronghold-card .card-image-wrap img { object-fit: contain; }

    .card-body { padding: 12px; }
    .card-name { font-size: 15px; font-weight: bold; line-height: 1.35; margin-bottom: 8px; }

    .card-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
    }

    .card-type,
    .card-set {
      display: inline-block;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
    }

    .card-type {
      background: rgba(34,197,94,.15);
      color: #86efac;
    }

    .card-set {
      background: rgba(255,255,255,.08);
      color: #cbd5e1;
    }

    .card-hint { font-size: 12px; color: #cbd5e1; }

    .empty-state {
      padding: 20px 24px 60px;
      color: #cbd5e1;
      display: none;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.88);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
    }

    .modal.open { display: flex; }

    .modal-content {
      position: relative;
      max-width: 1120px;
      width: 100%;
      max-height: 94vh;
      overflow: auto;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 14px;
      background: rgba(255,255,255,.1);
      color: white;
      border: 0;
      font-size: 26px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
    }

    .modal-close:hover { background: rgba(255,255,255,.2); }
    .modal-title {
      display: none;
    }

    .card-detail {
      display: grid;
      grid-template-columns: minmax(280px, 430px) minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .card-detail-images {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
    }

    .card-detail-images img {
      width: 100%;
      max-width: 430px;
      max-height: 78vh;
      object-fit: contain;
      border-radius: 12px;
      display: block;
    }

    .card-detail-images.landscape img {
      max-width: 700px;
    }

    .card-detail-double {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      width: 100%;
    }

    .card-detail-double figure {
      margin: 0;
      text-align: center;
    }

    .card-detail-double figcaption {
      margin-bottom: 8px;
      font-weight: bold;
      color: #cbd5e1;
    }

    .card-detail-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      max-height: 78vh;
    }

    .card-detail-info h2 {
      margin: 0 48px 8px 0;
      font-size: 34px;
      line-height: 1.15;
    }

    .card-detail-meta {
      color: #cbd5e1;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .info-box {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-item {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      padding: 12px 14px;
    }

    .info-label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 5px;
    }

    .info-value {
      display: block;
      color: #f8fafc;
      line-height: 1.4;
    }

    .history-heading {
      margin: 0 0 10px;
      font-size: 20px;
    }

    .history-scroll {
      overflow-y: auto;
      padding-right: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      min-height: 0;
    }

    .history-scroll p {
      margin: 0 0 1em;
    }

    .history-scroll:empty {
      min-height: 1px;
    }


    .card {
      cursor: pointer;
    }

    .card:focus-visible {
      outline: 3px solid #22c55e;
      outline-offset: 4px;
    }

    .modal-content {
      background:
        radial-gradient(circle at top right, rgba(34,197,94,.10), transparent 34%),
        #111827;
    }

    .card-detail-info {
      padding: 4px 4px 4px 0;
    }

    .history-heading {
      border-top: 1px solid rgba(255,255,255,.10);
      padding-top: 18px;
    }

    .history-scroll {
      color: #e5e7eb;
      scrollbar-color: #22c55e #111827;
      scrollbar-width: thin;
    }

    .history-scroll p:first-child {
      font-size: 1.04rem;
      color: #f8fafc;
    }

    .missing-lore {
      color: #94a3b8;
      font-style: italic;
    }

    .info-item {
      transition: border-color .2s ease, background .2s ease;
    }

    .info-item:hover {
      border-color: rgba(34,197,94,.45);
      background: rgba(34,197,94,.08);
    }

    @media (max-width: 1200px) {
      .card-grid { grid-template-columns: repeat(4, minmax(0,1fr)); }
    }

    @media (max-width: 900px) {
      .card-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .card-detail {
        grid-template-columns: 1fr;
      }

      .card-detail-info {
        max-height: none;
      }

      .history-scroll {
        max-height: 45vh;
      }
    }

    @media (max-width: 640px) {
      .card-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .page-header h1 { font-size: 30px; }
      .top-logo { height: 48px; }

      .card-detail-double {
        grid-template-columns: 1fr;
      }

      .card-detail-info h2 {
        font-size: 28px;
      }

      .info-box {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html"><img src="logo.png" alt="Worlds Under Siege" class="top-logo"></a>

      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="cards.html">Cards</a>
        <a href="deck-builder.html">Deck Builder</a>
        <a href="play-online.html">Play Online</a>
        <a href="rules.html">Rules</a>
        <a href="news.html">News</a>
        <a href="open-packs.html">Open Packs</a>
      </nav>
    </div>
  </header>

  <section class="page-header">
    <h1>Card Library</h1>
    <p>Browse the complete collection, search by name, and filter by card type or set.</p>
  </section>

  <section class="controls">
    <input type="search" id="searchInput" placeholder="Search by card name or number...">

    <select id="typeFilter">
      <option value="All">All Types</option>
      <option value="Character">Character</option>
      <option value="Animal">Animal</option>
      <option value="Construct">Construct</option>
      <option value="Action">Action</option>
      <option value="Item">Item</option>
      <option value="Event">Event</option>
      <option value="Stronghold">Stronghold</option>
      <option value="Army">Army</option>
    </select>

    <select id="setFilter">
      <option value="All">All Sets</option>
      <option value="BOA">Battle of Ages</option>
      <option value="SD1">Starter Deck 1</option>
    </select>
  </section>

  <div class="results-count" id="resultsCount"></div>
  <main class="card-grid" id="cardGrid"></main>
  <div class="empty-state" id="emptyState">No cards match your search.</div>

  <div class="modal" id="cardModal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <div class="modal-title" id="modalTitle"></div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="cards.js"></script>
  <script src="lore.js"></script>

  <script>
    const grid = document.getElementById("cardGrid");
    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");
    const setFilter = document.getElementById("setFilter");
    const resultsCount = document.getElementById("resultsCount");
    const emptyState = document.getElementById("emptyState");
    const modal = document.getElementById("cardModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalClose = document.getElementById("modalClose");

    function encodePath(path) {
      return encodeURI(path);
    }

    function typeIncludes(card, selectedType) {
      if (selectedType === "All") return true;
      return Array.isArray(card.type)
        ? card.type.includes(selectedType)
        : card.type === selectedType;
    }

    function matchesSearch(card, searchTerm) {
      const text = searchTerm.trim().toLowerCase();
      if (!text) return true;

      const searchable = [
        card.id,
        card.name,
        ...(card.searchNames || [])
      ];

      return searchable.some(value =>
        String(value).toLowerCase().includes(text)
      );
    }

    function getFilteredCards() {
      return cards.filter(card => {
        return (
          matchesSearch(card, searchInput.value) &&
          typeIncludes(card, typeFilter.value) &&
          (setFilter.value === "All" || card.set === setFilter.value)
        );
      });
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatHistory(text) {
      if (!text) {
        return '<p class="missing-lore">Lore has not been added for this card yet.</p>';
      }

      return String(text)
        .trim()
        .split(/\n\s*\n/)
        .filter(Boolean)
        .map(paragraph => `<p>${escapeHTML(paragraph.trim())}</p>`)
        .join("");
    }

    function buildInfoBox(entry) {
      if (!entry || typeof entry !== "object") return "";

      const fields = [
        ["Status", entry.status],
        ["Origin", entry.origin],
        ["First Recorded", entry.first],
        ["Time Period", entry.period],
        ["Aliases", entry.aliases]
      ].filter(([, value]) => value);

      if (!fields.length) return "";

      return `
        <div class="info-box">
          ${fields.map(([label, value]) => `
            <div class="info-item">
              <span class="info-label">${label}</span>
              <span class="info-value">${escapeHTML(value)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function openModal(card) {
      const typeLabel = Array.isArray(card.type)
        ? card.type.join(" • ")
        : card.type;

      const loreEntry = typeof lore !== "undefined" && lore[card.id]
        ? lore[card.id]
        : null;

      const history = typeof loreEntry === "string"
        ? loreEntry
        : loreEntry?.history || "";

      let imageSection;

      if (card.backImage) {
        imageSection = `
          <div class="card-detail-images">
            <div class="card-detail-double">
              <figure>
                <figcaption>Dr Jekyl</figcaption>
                <img src="${encodePath(card.image)}" alt="Dr Jekyl">
              </figure>
              <figure>
                <figcaption>Mr Hyde</figcaption>
                <img src="${encodePath(card.backImage)}" alt="Mr Hyde">
              </figure>
            </div>
          </div>
        `;
      } else {
        const isLandscape = Array.isArray(card.type)
          ? card.type.includes("Stronghold")
          : card.type === "Stronghold";

        imageSection = `
          <div class="card-detail-images ${isLandscape ? "landscape" : ""}">
            <img src="${encodePath(card.image)}" alt="${card.name}">
          </div>
        `;
      }

      modalTitle.textContent = card.name;

      modalBody.innerHTML = `
        <div class="card-detail">
          ${imageSection}

          <section class="card-detail-info">
            <h2>${escapeHTML(card.name)}</h2>
            <div class="card-detail-meta">${escapeHTML(card.id)} • ${escapeHTML(typeLabel)} • ${escapeHTML(card.set)}</div>
            ${buildInfoBox(loreEntry)}
            <h3 class="history-heading">History & Origins</h3>
            <div class="history-scroll">${formatHistory(history)}</div>
          </section>
        </div>
      `;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalBody.innerHTML = "";
      document.body.style.overflow = "";
    }

    function renderCards() {
      const filtered = getFilteredCards();
      grid.innerHTML = "";
      resultsCount.textContent = `${filtered.length} card${filtered.length === 1 ? "" : "s"} found`;
      emptyState.style.display = filtered.length ? "none" : "block";

      filtered.forEach(card => {
        const wrapper = document.createElement("article");
        const isStronghold = Array.isArray(card.type)
          ? card.type.includes("Stronghold")
          : card.type === "Stronghold";

        wrapper.className = isStronghold ? "card stronghold-card" : "card";
        wrapper.tabIndex = 0;
        wrapper.setAttribute("role", "button");
        wrapper.setAttribute("aria-label", `View ${card.name} card details and lore`);

        const typeLabel = Array.isArray(card.type)
          ? card.type.join(" • ")
          : card.type;

        wrapper.innerHTML = `
          <div class="card-image-wrap">
            <img src="${encodePath(card.image)}" alt="${card.name}" loading="lazy">
          </div>

          <div class="card-body">
            <div class="card-name">${escapeHTML(card.id)} — ${escapeHTML(card.name)}</div>
            <div class="card-meta">
              <span class="card-type">${escapeHTML(typeLabel)}</span>
              <span class="card-set">${escapeHTML(card.set)}</span>
            </div>
            <div class="card-hint">${card.backImage ? "View both sides and lore" : "View card lore"}</div>
          </div>
        `;

        wrapper.addEventListener("click", () => openModal(card));
        wrapper.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openModal(card);
          }
        });

        grid.appendChild(wrapper);
      });
    }

    searchInput.addEventListener("input", renderCards);
    typeFilter.addEventListener("change", renderCards);
    setFilter.addEventListener("change", renderCards);
    modalClose.addEventListener("click", closeModal);

    modal.addEventListener("click", event => {
      if (event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) {
        closeModal();
      }
    });

    // Apply homepage links such as cards.html?type=Animal, ?set=BOA, or ?card=BOA-001.
    const pageParams = new URLSearchParams(window.location.search);
    const requestedType = pageParams.get("type");
    const requestedSet = pageParams.get("set");
    const requestedCard = pageParams.get("card");

    if (requestedType && [...typeFilter.options].some(option => option.value === requestedType)) {
      typeFilter.value = requestedType;
    }

    if (requestedSet && [...setFilter.options].some(option => option.value === requestedSet)) {
      setFilter.value = requestedSet;
    }

    renderCards();

    if (requestedCard) {
      const selectedCard = cards.find(card => card.id === requestedCard);
      if (selectedCard) openModal(selectedCard);
    }
  </script>
</body>
</html>
