  <title>Cards - Worlds Under Siege</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }

    .topbar {
      background: #111827;
      padding: 18px 24px;
      border-bottom: 2px solid #1f2937;
    }

    .topbar-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .site-title {
      font-size: 28px;
      font-weight: bold;
      margin: 0;
    }

    .nav {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .nav a {
      text-decoration: none;
      color: white;
      background: rgba(255,255,255,0.08);
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
    }

    .nav a:hover {
      background: #22c55e;
    }

    .page-header {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 24px 10px;
    }

    .page-header h1 {
      margin: 0 0 10px;
      font-size: 36px;
    }

    .page-header p {
      margin: 0;
      color: #cbd5e1;
    }

    .controls {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls input,
    .controls select {
      padding: 12px 14px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .controls input {
      min-width: 260px;
      flex: 1 1 320px;
    }

    .controls select {
      min-width: 210px;
      background: white;
    }

    .results-count {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 18px;
      color: #cbd5e1;
    }

    .card-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px 40px;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .card-image-wrap {
      background: #0f172a;
      aspect-ratio: 63 / 88;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .card-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 12px;
    }

    .card-name {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .card-type {
      display: inline-block;
      font-size: 12px;
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .flip-note {
      font-size: 12px;
      color: #cbd5e1;
    }

    .empty-state {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 24px 60px;
      color: #cbd5e1;
      display: none;
    }
.stronghold-card .card-image-wrap{
  aspect-ratio: 88 / 63;
  background:#0b1020;
}

.stronghold-card .card-image-wrap img{
  object-fit: contain;
}
    @media (max-width: 1200px) {
      .card-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }
    }

    @media (max-width: 900px) {
      .card-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .card-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .site-title {
        font-size: 24px;
      }

      .page-header h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

      { name: "Sparta", type: "Stronghold", image: "cards/BOA-186 Sparta.jpg" },
      { name: "Pembroke Castle", type: "Stronghold", image: "cards/BOA-187 Pembroke Castle.jpg" },
      { name: "Sherwood Forest", type: "Stronghold", image: "cards/BOA-188 Sherwood Forest.jpg" },
      { name: "Nottingham Castle", type: "Stronghold", image: "cards/BOA-189 Nottingham Castle.jpg" },
      { name: "Davinci's Workshop", type: "Stronghold", image: "cards/BOA-190 Davinci's Workshop.jpg" },

      { name: "Camelot Soldier", type: "Army", image: "cards/BOA-191 Camelot Soldier.jpg" },
      { name: "Camelot Spearman", type: "Army", image: "cards/BOA-192 Camelot Spearman.jpg" },
      { name: "Camelot Archer", type: "Army", image: "cards/BOA-193 Camelot Archer.jpg" },
      { name: "Zombie", type: "Army", image: "cards/BOA-194 Zombie.jpg" },
      { name: "Mummy", type: "Army", image: "cards/BOA-195 Mummy.jpg" },
      { name: "Vampire Bats", type: "Army", image: "cards/BOA-196 Vampire Bats.jpg" },
      { name: "Spartan Soldier", type: "Army", image: "cards/BOA-197 Spartan Soldier.jpg" },
      { name: "Kulonga Warrior", type: "Army", image: "cards/BOA-198 Kulonga Warrior.jpg" },
      { name: "Skeleton", type: "Army", image: "cards/BOA-199 Skeleton.jpg" },
      { name: "Persian Immortal", type: "Army", image: "cards/BOA-200 Persian Immortal.jpg" }
    ];

    const grid = document.getElementById("cardGrid");
    const searchInput = document.getElementById("searchInput");
    const typeFilter = document.getElementById("typeFilter");
    const resultsCount = document.getElementById("resultsCount");
    const emptyState = document.getElementById("emptyState");

    function encodePath(path) {
      return encodeURI(path);
    }

    function matchesSearch(card, searchTerm) {
      const text = searchTerm.trim().toLowerCase();
      if (!text) return true;

      const namesToSearch = [card.name, ...(card.searchNames || [])];
      return namesToSearch.some(name => name.toLowerCase().includes(text));
    }

    function getFilteredCards() {
      const searchTerm = searchInput.value;
      const selectedType = typeFilter.value;

      return cards.filter(card => {
        const typeMatches = selectedType === "All" || card.type === selectedType;
        const searchMatches = matchesSearch(card, searchTerm);
        return typeMatches && searchMatches;
      });
    }

    function renderCards() {
      const filtered = getFilteredCards();
      grid.innerHTML = "";

      resultsCount.textContent = `${filtered.length} card${filtered.length === 1 ? "" : "s"} found`;

      if (filtered.length === 0) {
        emptyState.style.display = "block";
        return;
      } else {
        emptyState.style.display = "none";
      }

      filtered.forEach((card, index) => {
        const wrapper = document.createElement("article");
        wrapper.className = card.type === "Stronghold" ? "card stronghold-card" : "card";

        const flipNote = card.backImage
          ? `<div class="flip-note">Click image to flip</div>`
          : "";

        wrapper.innerHTML = `
          <div class="card-image-wrap" data-index="${index}">
            <img src="${encodePath(card.image)}" alt="${card.name}" data-front="${encodePath(card.image)}" ${card.backImage ? `data-back="${encodePath(card.backImage)}" data-side="front"` : ""}>
          </div>
          <div class="card-body">
            <div class="card-name">${card.name}</div>
            <div class="card-type">${card.type}</div>
            ${flipNote}
          </div>
        `;

        grid.appendChild(wrapper);
      });

      document.querySelectorAll(".card-image-wrap img[data-back]").forEach(img => {
        img.addEventListener("click", () => {
          const side = img.getAttribute("data-side");
          if (side === "front") {
            img.src = img.getAttribute("data-back");
            img.setAttribute("data-side", "back");
          } else {
            img.src = img.getAttribute("data-front");
            img.setAttribute("data-side", "front");
          }
        });
      });
    }

    searchInput.addEventListener("input", renderCards);
    typeFilter.addEventListener("change", renderCards);

    renderCards();
  </script>
</body>
</html>
