<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Choose New Password to Worlds Under Siege.">
  <title>Choose New Password - Worlds Under Siege</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body data-auth-page="update-password">
  <div class="auth-shell">
<main class="auth-main">
      <div class="single-auth-card">
        
        <section class="auth-form-card">
          <div class="auth-eyebrow">Player Account</div>
          <h2>Choose New Password</h2>
          <p class="auth-intro">Use the secure link from your password-reset email to set a new password.</p>
          <p class="auth-message" data-auth-message hidden role="status" aria-live="polite"></p>
          
<form class="auth-form" data-update-password-form aria-disabled="true">
  <div class="auth-field">
    <label for="newPassword">New password</label>
    <input id="newPassword" name="password" type="password" minlength="8"
           autocomplete="new-password" required>
  </div>
  <div class="auth-field">
    <label for="confirmNewPassword">Confirm new password</label>
    <input id="confirmNewPassword" name="confirmPassword" type="password" minlength="8"
           autocomplete="new-password" required>
  </div>
  <button class="auth-submit" type="submit">Update Password</button>
</form>

          <div class="auth-links"><a href="login.html">Return to login</a></div>
        </section>
      </div>
    </main>
    <footer class="auth-footer">
      © 2026 Worlds Under Siege™
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </footer>
  </div>
  <script type="module" src="auth-pages.js"></script>
  <script src="global-click-sound.js"></script>
</body>
</html>
