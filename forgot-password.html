<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Reset Password to Worlds Under Siege.">
  <title>Reset Password - Worlds Under Siege</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body data-auth-page="forgot-password">
  <div class="auth-shell">
<main class="auth-main">
      <div class="single-auth-card">
        
        <section class="auth-form-card">
          <div class="auth-eyebrow">Player Account</div>
          <h2>Reset Password</h2>
          <p class="auth-intro">Enter the email address used by your account.</p>
          <p class="auth-message" data-auth-message hidden role="status" aria-live="polite"></p>
          
<form class="auth-form" data-forgot-form>
  <div class="auth-field">
    <label for="forgotEmail">Email address</label>
    <input id="forgotEmail" name="email" type="email" autocomplete="email" required>
  </div>
  <button class="auth-submit" type="submit">Send Reset Link</button>
</form>

          <div class="auth-links"><a href="login.html">Return to login</a></div>
        </section>
      </div>
    </main>
    <footer class="auth-footer">
      © 2026 Worlds Under Siege™
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </footer>
  </div>
  <script type="module" src="auth-pages.js"></script>
  <script src="global-click-sound.js"></script>
</body>
</html>
