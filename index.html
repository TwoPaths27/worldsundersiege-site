<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worlds Under Siege</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#0b1020;
color:white;
text-align:center;
}

/* BANNER */

.top-banner{
width:100%;
height:440px;
background:url("banner.jpg") center/cover no-repeat;
position:relative;
}

/* MENU INSIDE BANNER */

.banner-menu{
position:absolute;
bottom:25px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:25px;
}

.banner-menu a{
text-decoration:none;
color:white;
background:rgba(0,0,0,0.65);
padding:12px 28px;
border-radius:8px;
font-weight:bold;
letter-spacing:1px;
transition:0.2s;
}

.banner-menu a:hover{
background:#22c55e;
transform:translateY(-2px);
}

/* LOGO */

.logo-section{
padding:30px 20px 10px;
}

.logo{
width:180px;
height:auto;
display:block;
margin:0 auto;
}

/* CONTENT */

.content{
max-width:900px;
margin:auto;
padding:30px 20px 60px;
}

.content h2{
font-size:32px;
margin-bottom:15px;
}

.content p{
font-size:18px;
color:#cbd5e1;
line-height:1.6;
}

</style>

</head>

<body>

<header class="top-banner">

<nav class="banner-menu">
<a href="index.html">Home</a>
<a href="cards.html">Cards</a>
<a href="#">Rules</a>
<a href="#">News</a>
</nav>

</header>

<section class="logo-section">
<img src="logo.png" class="logo">
</section>

<main class="content">

<h2>Welcome to Worlds Under Siege</h2>

<p>
Explore the world of Worlds Under Siege, discover powerful cards,
learn the rules of battle, and stay updated with the latest news.
</p>

</main>

</body>
</html>
