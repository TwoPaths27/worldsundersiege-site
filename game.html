<!DOCTYPE html><html><head><meta charset='utf-8'><title>Worlds Under Siege - Game Prototype</title>
<style>
body{margin:0;font-family:Arial;background:#243028;color:#fff}
#layout{display:grid;grid-template-columns:220px 1fr 260px;gap:10px;padding:10px}
#left,#right{background:#18221d;padding:10px;border-radius:8px}
#board{display:grid;grid-template-columns:repeat(6,80px);grid-template-rows:repeat(7,80px);gap:2px;justify-content:center}
.cell{background:#4a5a49;border:1px solid #222;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sel{outline:3px solid yellow}.move{background:#4c7cff}
#hand{display:flex;gap:8px;overflow:auto;padding:10px}
.card{background:#333;padding:8px;border:1px solid #777;cursor:pointer;min-width:90px}
</style></head><body>
<div id='layout'><div id='left'><h3>Turn</h3><div id='turn'>Player 1</div><div id='energy'>Energy 1/1</div><button id='end'>End Turn</button></div>
<div><div id='board'></div><h3>Hand</h3><div id='hand'></div></div>
<div id='right'><h3>Selected</h3><pre id='info'>None</pre></div></div>
<script src='game.js'></script></body></html>
